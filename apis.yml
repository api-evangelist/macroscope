aid: macroscope
name: Macroscope
description: >-
  Macroscope is an AI code-intelligence platform (GitHub org prassoai) that
  connects to a team's codebase and workflow tools to review pull requests,
  answer questions, and take action. Its three surfaces are an Agent (query the
  codebase and trigger actions via Slack, GitHub, or an HTTP API), Code Review
  (automatic bug detection, PR descriptions, and fixes on every pull request),
  and Status (commit summaries, area classification, productivity insights, and
  sprint reports). Macroscope integrates with GitHub, Slack, Jira, Linear,
  BigQuery, PostHog, LaunchDarkly, and GCP Cloud Logging, ships a local CLI plus
  plugins for Claude Code, Codex, Cursor, and OpenCode, and exposes a public
  agent webhook API. Billing is usage-based (prepaid, Stripe-metered). Macroscope
  is backed by Lightspeed Venture Partners. Enriched into the API Evangelist
  network from its public developer documentation.
